<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>حساب المعدل</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #e6ccff, #f3e6ff);
}

.container{
    background:white;
    padding:25px;
    width:460px;
    border-radius:16px;
    box-shadow:0 0 25px rgba(0,0,0,0.25);
    text-align:center;
}

input{
    width:85%;
    padding:8px;
    margin:6px 0;
    text-align:center;
    border-radius:6px;
    border:1px solid #ccc;
}

button{
    padding:10px 22px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#7b2ff7;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{background:#5f22c9;}

.lang{margin-bottom:10px;}

.note{
    background:#fdeaea;
    border:1px solid #e74c3c;
    color:#b30000;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
    text-align:right;
}

#result{
    margin-top:18px;
    padding:16px;
    border:4px solid;
    border-radius:12px;
    display:none;
    font-weight:bold;
}

.success{border-color:#1fa64a;color:#1fa64a;}
.fail{border-color:#d11a2a;color:#d11a2a;}

.signature{
    margin-top:18px;
    font-size:12px;
    color:#777;
    font-style:italic;
}
</style>
</head>

<body>

<div class="container">

<div class="lang">
    <button onclick="setLang('ar')">AR</button>
    <button onclick="setLang('en')">EN</button>
</div>

<h2 id="title"></h2>

<!-- الصفحة الأولى -->
<div id="step1">
    <p id="modulesText"></p>
    <input type="number" id="modules" min="1">
    <br><br>
    <button id="confirmBtn" onclick="goToStep2()"></button>
</div>

<!-- الصفحة الثانية -->
<div id="step2" style="display:none;">
    <div class="note" id="noteText"></div>
    <div id="marks"></div>
    <button id="calcBtn" onclick="calculate()"></button>
</div>

<div id="result"></div>

<div class="signature">Designed by Hadjer Programmer</div>

</div>

<script>
let lang="ar";
let lastAvg=null;

const text={
ar:{
title:"حساب المعدل",
modules:"أدخل عدد المواد",
confirm:"تأكيد",
calc:"حساب المعدل",
note:"📌 تنويه: اترك خانة CC فارغة إذا كانت غير موجودة، في هذه الحالة تُحسب علامة الامتحان فقط.",
mark:"المادة",
cc:"CC",
exam:"الامتحان",
coef:"المعامل",
success:"🌟 أحسنت! نجاحك اليوم خطوة جديدة نحو مستقبل أفضل.",
fail:"🌱 لا تيأس، ما زالت لديك فرصة، بالاجتهاد ستصل.",
avg:"معدل الفصل الأول",
need:"معدل الفصل الثاني المطلوب للنجاح:"
},
en:{
title:"Average Calculator",
modules:"Enter number of modules",
confirm:"Confirm",
calc:"Calculate average",
note:"📌 Note: Leave CC empty if it does not exist. Only exam mark will be counted.",
mark:"Module",
cc:"CC",
exam:"Exam",
coef:"Coefficient",
success:"🌟 Well done! Your success is a new step forward.",
fail:"🌱 Don't give up, you still have a chance.",
avg:"Semester 1 average",
need:"Required semester 2 average to pass:"
}
};

function setLang(l){
lang=l;
document.body.dir=(l==="ar")?"rtl":"ltr";
document.getElementById("title").innerText=text[l].title;
document.getElementById("modulesText").innerText=text[l].modules;
document.getElementById("confirmBtn").innerText=text[l].confirm;
document.getElementById("calcBtn").innerText=text[l].calc;
document.getElementById("noteText").innerText=text[l].note;

if(lastAvg!==null) showResult(lastAvg);
}

function goToStep2(){
const n=parseInt(document.getElementById("modules").value);
if(!n||n<=0)return;

document.getElementById("step1").style.display="none";
document.getElementById("step2").style.display="block";

let html="";
for(let i=1;i<=n;i++){
html+=`
<div>
<h4>${text[lang].mark} ${i}</h4>
<label>${text[lang].cc}</label><br>
<input type="number" id="cc${i}" min="0" max="20"><br>
<label>${text[lang].exam}</label><br>
<input type="number" id="exam${i}" min="0" max="20"><br>
<label>${text[lang].coef}</label><br>
<input type="number" id="coef${i}" min="1"><hr>
</div>`;
}
document.getElementById("marks").innerHTML=html;
}

function calculate(){
const n=document.querySelectorAll("#marks > div").length;
let total=0,totalCoef=0;

for(let i=1;i<=n;i++){
const cc=document.getElementById("cc"+i).value;
const exam=parseFloat(document.getElementById("exam"+i).value)||0;
const coef=parseFloat(document.getElementById("coef"+i).value)||1;
let note=(cc==="")?exam:(parseFloat(cc)*0.4+exam*0.6);
total+=note*coef;
totalCoef+=coef;
}

lastAvg=total/totalCoef;
showResult(lastAvg);
}

function showResult(avg){
const res=document.getElementById("result");
res.style.display="block";

if(avg>=10){
res.className="success";
res.innerHTML=`${text[lang].success}<br>${text[lang].avg}: ${avg.toFixed(2)}`;
}else{
const needed=(20-avg).toFixed(2);
res.className="fail";
res.innerHTML=`
${text[lang].fail}<br>
${text[lang].avg}: ${avg.toFixed(2)}<br>
${text[lang].need} ${needed}
`;
}
}

setLang("ar");
</script>

</body>
</html>
